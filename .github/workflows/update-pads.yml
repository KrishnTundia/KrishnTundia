name: Update RGB Mixer Pads

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/gen-pads.mjs"

permissions:
  contents: write

jobs:
  build-pads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate 3-stage RGB mixer pads from live GitHub load
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gen-pads.mjs
      - name: Commit updated pads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pads/
          git diff --staged --quiet || (git commit -m "chore: refresh RGB mixer pads" && git push)
